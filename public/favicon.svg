<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Diagonal gradient with Bhutan national colors (Yellow and Orange) -->
    <linearGradient id="bhutan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD100" />
      <stop offset="100%" stop-color="#FF671F" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle base -->
  <circle cx="50" cy="50" r="48" fill="url(#bhutan-grad)" />
  
  <!-- White decorative inner ring for premium badge feel -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9" />
  
  <!-- Taekwondo High Kick Silhouette (Black / Dark Navy for high contrast) -->
  <!-- Kicking Athlete -->
  <g fill="#070D1A">
    <!-- Head -->
    <circle cx="43" cy="23" r="6" />
    
    <!-- Torso and Limbs (Dynamic High Kick Pose) -->
    <path d="M 43,30 
             C 41,36 39,43 38,47 
             L 68,26 
             L 76,21 
             L 78,25 
             L 69,33 
             L 45,50 
             L 49,72 
             L 41,74 
             L 37,51 
             L 24,56 
             L 21,50 
             L 36,41 Z" />
             
    <!-- Standing Supporting Leg -->
    <path d="M 38,48 L 26,71 L 19,67 L 33,45 Z" />
  </g>
</svg>